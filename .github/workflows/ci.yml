name: Mentorax CI

on:
  push:
    branches:
      - main
      - ci-cd

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mentorax-ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pmentorax-ci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      lifecycle_mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mentorax-lifecycle-ci-root-password
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pmentorax-lifecycle-ci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_ROOT_PASSWORD: mentorax-ci-root-password
      MENTORAX_MYSQL_MIGRATION_TEST_URL: jdbc:mysql://127.0.0.1:3306/mentorax_migration_test
      MENTORAX_MYSQL_MIGRATION_TEST_USERNAME: root
      MENTORAX_MYSQL_MIGRATION_TEST_PASSWORD: mentorax-ci-root-password
      MENTORAX_MYSQL_RECOVERY_TEST_URL: jdbc:mysql://127.0.0.1:3306/mentorax_recovery_test
      MENTORAX_MYSQL_RECOVERY_TEST_USERNAME: root
      MENTORAX_MYSQL_RECOVERY_TEST_PASSWORD: mentorax-ci-root-password
      PHASE26_PROCESSING_MYSQL_URL: jdbc:mysql://127.0.0.1:3308/mentorax_phase26_lifecycle_test
      PHASE26_PROCESSING_MYSQL_USERNAME: root
      PHASE26_PROCESSING_MYSQL_PASSWORD: mentorax-lifecycle-ci-root-password

    defaults:
      run:
        working-directory: alumni-connect

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Create disposable MySQL integration-test schemas
        run: |
          mysql --host=127.0.0.1 --port=3306 --user=root --password="$MYSQL_ROOT_PASSWORD" \
            --execute="CREATE DATABASE mentorax_migration_test; CREATE DATABASE mentorax_recovery_test;"

      - name: Require configured disposable MySQL schemas
        run: |
          test -n "$MENTORAX_MYSQL_MIGRATION_TEST_URL"
          test -n "$MENTORAX_MYSQL_MIGRATION_TEST_USERNAME"
          test -n "$MENTORAX_MYSQL_MIGRATION_TEST_PASSWORD"
          test -n "$MENTORAX_MYSQL_RECOVERY_TEST_URL"
          test -n "$MENTORAX_MYSQL_RECOVERY_TEST_USERNAME"
          test -n "$MENTORAX_MYSQL_RECOVERY_TEST_PASSWORD"

      - name: Run real-MySQL migration tests
        run: ./mvnw -q "-Dtest=FreshMySqlMigrationTest" test

      - name: Create isolated lifecycle test schema
        run: |
          mysql --host=127.0.0.1 --port=3308 --user=root \
            --password="$PHASE26_PROCESSING_MYSQL_PASSWORD" \
            --execute="CREATE DATABASE mentorax_phase26_lifecycle_test;"

      - name: Run database-backed processing lifecycle tests
        run: ./mvnw "-Dphase26.processing.mysql=true" "-Dtest=ExperienceClaimProcessingMySqlLifecycleTest" test

      - name: Recreate disposable schemas before full backend suite
        run: |
          MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --host=127.0.0.1 --port=3306 --user=root \
            --execute="DROP DATABASE mentorax_migration_test; DROP DATABASE mentorax_recovery_test; CREATE DATABASE mentorax_migration_test; CREATE DATABASE mentorax_recovery_test;"

      - name: Run backend tests
        run: ./mvnw test


  python:
    name: Python Analysis Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mentorax-ai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.8'
          cache: pip
          cache-dependency-path: |
            mentorax-ai/requirements.txt
            mentorax-ai/requirements-test.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Check Python syntax and imports
        run: python -m compileall -q .

      - name: Run Python unit and API tests
        run: python -m unittest discover -s tests -v

      - name: Run Python evaluation tests
        run: python -m unittest discover -s evaluation -v


  flutter:
    name: Flutter Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: alumni_connect_mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Verify Flutter version
        run: flutter --version | grep -F 'Flutter 3.47.9'

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test


  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs:
      - backend
      - flutter

    defaults:
      run:
        working-directory: alumni_connect_mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build debug APK
        run: >-
          flutter build apk --debug
          --dart-define=API_BASE_URL=https://mentorax-production.up.railway.app

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mentorax-debug-apk
          path: alumni_connect_mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error