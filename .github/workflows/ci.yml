name: Mentorax CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - ci-cd
      - phase-2-6-full-review

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alumni-connect

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Provision disposable TLS MySQL instances and CA truststore
        shell: bash
        run: |
          set -euo pipefail

          tls_dir="$RUNNER_TEMP/mentorax-mysql-tls"
          ca_dir="$RUNNER_TEMP/mentorax-mysql-ca"
          truststore="$RUNNER_TEMP/mentorax-mysql-ca.p12"
          root_password_file="$RUNNER_TEMP/mentorax-mysql-root-password"
          mkdir -m 700 "$tls_dir" "$ca_dir"

          openssl req -x509 -newkey rsa:3072 -nodes \
            -keyout "$ca_dir/ca-key.pem" -out "$tls_dir/ca.pem" -days 2 -sha256 \
            -subj "/CN=Mentorax Disposable CI MySQL CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
          chmod 600 "$ca_dir/ca-key.pem"

          openssl req -new -newkey rsa:2048 -nodes \
            -keyout "$tls_dir/server-key.pem" -out "$tls_dir/server.csr" \
            -subj "/CN=127.0.0.1"
          cat > "$tls_dir/server.ext" <<'EOF'
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=IP:127.0.0.1
          EOF
          openssl x509 -req -in "$tls_dir/server.csr" \
            -CA "$tls_dir/ca.pem" -CAkey "$ca_dir/ca-key.pem" -CAcreateserial \
            -out "$tls_dir/server-cert.pem" -days 2 -sha256 -extfile "$tls_dir/server.ext"
          chmod 600 "$tls_dir/server-key.pem"
          rm "$tls_dir/server.csr" "$tls_dir/server.ext"

          # The container entrypoint installs the mounted key with mysql-owned, private permissions.
          cat > "$tls_dir/mysql-entrypoint.sh" <<'EOF'
          #!/bin/bash
          set -euo pipefail
          install -d -o mysql -g mysql -m 750 /var/lib/mysql-tls
          install -o mysql -g mysql -m 640 /tls/ca.pem /var/lib/mysql-tls/ca.pem
          install -o mysql -g mysql -m 640 /tls/server-cert.pem /var/lib/mysql-tls/server-cert.pem
          install -o mysql -g mysql -m 600 /tls/server-key.pem /var/lib/mysql-tls/server-key.pem
          exec /usr/local/bin/docker-entrypoint.sh mysqld \
            --ssl-ca=/var/lib/mysql-tls/ca.pem \
            --ssl-cert=/var/lib/mysql-tls/server-cert.pem \
            --ssl-key=/var/lib/mysql-tls/server-key.pem \
            --require_secure_transport=ON
          EOF
          chmod 700 "$tls_dir/mysql-entrypoint.sh"

          store_password="$(openssl rand -hex 24)"
          backend_root_password="$(openssl rand -hex 24)"
          lifecycle_root_password="$(openssl rand -hex 24)"
          migration_password="$(openssl rand -hex 24)"
          recovery_password="$(openssl rand -hex 24)"
          lifecycle_password="$(openssl rand -hex 24)"
          for value in "$store_password" "$backend_root_password" "$lifecycle_root_password" \
            "$migration_password" "$recovery_password" "$lifecycle_password"; do
            echo "::add-mask::$value"
          done

          keytool -importcert -noprompt -alias mentorax-ci-mysql-ca \
            -file "$tls_dir/ca.pem" -keystore "$truststore" -storetype PKCS12 \
            -storepass "$store_password" >/dev/null

          printf '%s' "$backend_root_password" > "$root_password_file"
          chmod 600 "$root_password_file"

          docker run --detach --name mentorax-ci-mysql \
            --health-cmd='MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqladmin ping --host=127.0.0.1 --user=root --silent' \
            --health-interval=5s --health-timeout=5s --health-retries=24 --health-start-period=30s \
            --publish 3306:3306 \
            --env MYSQL_ROOT_PASSWORD="$backend_root_password" \
            --mount "type=bind,src=$tls_dir,dst=/tls,readonly" \
            --entrypoint /bin/bash mysql:8.0.46 /tls/mysql-entrypoint.sh
          docker run --detach --name mentorax-ci-lifecycle-mysql \
            --health-cmd='MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqladmin ping --host=127.0.0.1 --user=root --silent' \
            --health-interval=5s --health-timeout=5s --health-retries=24 --health-start-period=30s \
            --publish 3308:3306 \
            --env MYSQL_ROOT_PASSWORD="$lifecycle_root_password" \
            --mount "type=bind,src=$tls_dir,dst=/tls,readonly" \
            --entrypoint /bin/bash mysql:8.0.46 /tls/mysql-entrypoint.sh

          wait_for_mysql() {
            local container="$1"
            for attempt in $(seq 1 120); do
              state="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
              if [ "$state" = healthy ]; then return 0; fi
              if [ "$state" = unhealthy ]; then
                docker logs "$container" >&2
                return 1
              fi
              sleep 2
            done
            docker logs "$container" >&2
            return 1
          }
          wait_for_mysql mentorax-ci-mysql
          wait_for_mysql mentorax-ci-lifecycle-mysql

          MYSQL_PWD="$backend_root_password" docker exec --env MYSQL_PWD \
            mentorax-ci-mysql mysql --host=127.0.0.1 --user=root --execute="
              CREATE DATABASE mentorax_migration_test;
              CREATE DATABASE mentorax_recovery_test;
              CREATE USER 'mentorax_migration_test_user'@'%' IDENTIFIED BY '$migration_password';
              CREATE USER 'mentorax_recovery_test_user'@'%' IDENTIFIED BY '$recovery_password';
              GRANT ALL PRIVILEGES ON mentorax_migration_test.* TO 'mentorax_migration_test_user'@'%';
              GRANT ALL PRIVILEGES ON mentorax_recovery_test.* TO 'mentorax_recovery_test_user'@'%';"
          MYSQL_PWD="$lifecycle_root_password" docker exec --env MYSQL_PWD \
            mentorax-ci-lifecycle-mysql mysql --host=127.0.0.1 --user=root --execute="
              CREATE DATABASE mentorax_phase26_lifecycle_test;
              CREATE USER 'mentorax_phase26_test_user'@'%' IDENTIFIED BY '$lifecycle_password';
              GRANT ALL PRIVILEGES ON mentorax_phase26_lifecycle_test.* TO 'mentorax_phase26_test_user'@'%';"

          {
            echo "DB_CA_TRUSTSTORE_PATH=$truststore"
            echo "DB_CA_TRUSTSTORE_PASSWORD=$store_password"
            echo "DB_CA_TRUSTSTORE_TYPE=PKCS12"
            echo "MENTORAX_MYSQL_MIGRATION_TEST_URL=jdbc:mysql://127.0.0.1:3306/mentorax_migration_test"
            echo "MENTORAX_MYSQL_MIGRATION_TEST_USERNAME=mentorax_migration_test_user"
            echo "MENTORAX_MYSQL_MIGRATION_TEST_PASSWORD=$migration_password"
            echo "MENTORAX_MYSQL_RECOVERY_TEST_URL=jdbc:mysql://127.0.0.1:3306/mentorax_recovery_test"
            echo "MENTORAX_MYSQL_RECOVERY_TEST_USERNAME=mentorax_recovery_test_user"
            echo "MENTORAX_MYSQL_RECOVERY_TEST_PASSWORD=$recovery_password"
            echo "PHASE26_PROCESSING_MYSQL_URL=jdbc:mysql://127.0.0.1:3308/mentorax_phase26_lifecycle_test"
            echo "PHASE26_PROCESSING_MYSQL_USERNAME=mentorax_phase26_test_user"
            echo "PHASE26_PROCESSING_MYSQL_PASSWORD=$lifecycle_password"
          } >> "$GITHUB_ENV"

      - name: Verify disposable MySQL integration-test schemas
        run: |
          test -n "$MENTORAX_MYSQL_MIGRATION_TEST_URL"
          test -n "$MENTORAX_MYSQL_RECOVERY_TEST_URL"

      - name: Require configured disposable MySQL schemas
        run: |
          test -n "$MENTORAX_MYSQL_MIGRATION_TEST_URL"
          test -n "$MENTORAX_MYSQL_MIGRATION_TEST_USERNAME"
          test -n "$MENTORAX_MYSQL_MIGRATION_TEST_PASSWORD"
          test -n "$MENTORAX_MYSQL_RECOVERY_TEST_URL"
          test -n "$MENTORAX_MYSQL_RECOVERY_TEST_USERNAME"
          test -n "$MENTORAX_MYSQL_RECOVERY_TEST_PASSWORD"

      - name: Run real-MySQL migration tests
        run: ./mvnw -q "-Dtest=FreshMySqlMigrationTest" test

      - name: Verify lifecycle test database connectivity
        run: |
          MYSQL_PWD="$PHASE26_PROCESSING_MYSQL_PASSWORD" mysql \
            --host=127.0.0.1 --port=3308 \
            --user="$PHASE26_PROCESSING_MYSQL_USERNAME" \
            --ssl-mode=VERIFY_IDENTITY \
            --ssl-ca="$RUNNER_TEMP/mentorax-mysql-tls/ca.pem" \
            --database=mentorax_phase26_lifecycle_test \
            --execute="SELECT 1;"

      - name: Run database-backed processing lifecycle tests
        run: ./mvnw "-Dphase26.processing.mysql=true" "-Dtest=ExperienceClaimProcessingMySqlLifecycleTest" test

      - name: Recreate disposable schemas before full backend suite
        run: |
          mysql_container_password="$(cat "$RUNNER_TEMP/mentorax-mysql-root-password")"
          MYSQL_PWD="$mysql_container_password" docker exec --env MYSQL_PWD \
            mentorax-ci-mysql mysql --host=127.0.0.1 --user=root \
            --execute="DROP DATABASE mentorax_migration_test; DROP DATABASE mentorax_recovery_test; CREATE DATABASE mentorax_migration_test; CREATE DATABASE mentorax_recovery_test;"

      - name: Run backend tests
        run: ./mvnw test

      - name: Remove disposable MySQL containers and TLS files
        if: always()
        shell: bash
        run: |
          docker rm --force mentorax-ci-mysql mentorax-ci-lifecycle-mysql >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/mentorax-mysql-tls" "$RUNNER_TEMP/mentorax-mysql-ca" \
            "$RUNNER_TEMP/mentorax-mysql-ca.p12" "$RUNNER_TEMP/mentorax-mysql-root-password"


  python:
    name: Python Analysis Tests
    runs-on: ubuntu-24.04
    env:
      MENTOR_ENVIRONMENT: production
      MENTOR_API_DOCS_ENABLED: 'false'

    defaults:
      run:
        working-directory: mentorax-ai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            mentorax-ai/requirements.txt
            mentorax-ai/requirements-test.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Check Python syntax and imports
        run: python -m compileall -q .

      - name: Run Python unit and API tests
        run: python -m unittest discover -s tests -v

      - name: Run Python evaluation tests
        run: python -m unittest discover -s evaluation -v


  flutter:
    name: Flutter Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: alumni_connect_mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Verify Flutter version
        run: flutter --version | grep -F 'Flutter 3.47.9'

      - name: Get dependencies
        run: flutter pub get

      - name: Validate production API configuration
        run: dart run tool/validate_api_config.dart

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test --dart-define=API_BASE_URL=https://api.example.test


  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs:
      - backend
      - flutter

    defaults:
      run:
        working-directory: alumni_connect_mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Configure Flutter to use Java 21
        run: flutter config --jdk-dir="$JAVA_HOME"

      - name: Verify Gradle uses Java 21
        run: |
          gradle_version="$(./android/gradlew --version)"
          printf '%s\n' "$gradle_version"
          printf '%s\n' "$gradle_version" | grep -Eq 'JVM: 21([.]|[+])'

      - name: Get dependencies
        run: flutter pub get

      - name: Validate production API configuration
        run: dart run tool/validate_api_config.dart

      - name: Build debug APK
        run: |
          PRODUCTION_API_URL="$(dart run tool/validate_api_config.dart --print-production-url)"
          flutter build apk --debug --dart-define=API_BASE_URL="$PRODUCTION_API_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: mentorax-debug-apk
          path: alumni_connect_mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
