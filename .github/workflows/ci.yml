name: Mentorax CI

on:
  push:
    branches:
      - main
      - ci-cd

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: alumni-connect

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests
        run: ./mvnw test


  flutter:
    name: Flutter Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: alumni_connect_mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test


  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs:
      - backend
      - flutter

    defaults:
      run:
        working-directory: alumni_connect_mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mentorax-debug-apk
          path: alumni_connect_mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error