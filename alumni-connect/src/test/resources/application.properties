```properties
# Production MySQL configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Database migrations
spring.flyway.enabled=true

# JWT — supplied by Railway
jwt.secret=${JWT_SECRET}

# CORS and WebSocket — supplied by Railway
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS}
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS}

# Email — supplied by Railway
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
```
