spring.datasource.url=jdbc:h2:mem:mentorax-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false
app.email-outbox.enabled=false
app.email-verification.required=true
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
management.endpoint.health.show-components=always

jwt.secret=test-jwt-secret-that-is-at-least-32-characters-long
app.websocket.allowed-origins=http://localhost
app.cors.allowed-origin-patterns=http://localhost
