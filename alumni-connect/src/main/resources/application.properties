```properties
# Production database: Railway MySQL
server.port=${PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway migrations
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
management.endpoint.health.show-components=always

# JWT
jwt.secret=${JWT_SECRET}

# CORS and WebSocket
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS}
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS}

# Email
# Email delivery uses the Resend API. Set RESEND_API_KEY and RESEND_FROM_EMAIL.
# The sender must be verified for the configured Resend account/domain.
# Temporary testing mode: set EMAIL_VERIFICATION_REQUIRED=true to restore OTP gates.
app.email-verification.required=${EMAIL_VERIFICATION_REQUIRED:false}
```
