```properties
# Production database: Railway MySQL
server.port=${PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway migrations
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
management.endpoint.health.show-components=always

# JWT
jwt.secret=${JWT_SECRET}

# CORS and WebSocket
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS}
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS}

# Email verification and password-reset delivery require a verified Resend
# sender. Outbox delivery is asynchronous and enabled by default.
app.email-outbox.enabled=${EMAIL_OUTBOX_ENABLED:true}
app.email-outbox.poll-delay-ms=${EMAIL_OUTBOX_POLL_DELAY_MS:5000}

# Process-local STOMP send limiter. Use shared storage before scaling out.
app.websocket.rate-limit.messages=${WEBSOCKET_RATE_LIMIT_MESSAGES:60}
app.websocket.rate-limit.window-ms=${WEBSOCKET_RATE_LIMIT_WINDOW_MS:60000}

```

# Optional on-demand AI ranking service. Disabled by default; Java fallback remains available.
app.ai.enabled=${AI_MENTOR_ENABLED:false}
app.ai.service-url=${AI_SERVICE_URL:http://127.0.0.1:8090}
